name: CI

# Fast tier: runs on every push / PR. Pure-Python smoke + integration tests
# (no R). Tests that shell out to R auto-skip via tests/conftest.py when no R
# interpreter is present, so this tier needs only Python + lifelines.
#
# The rigorous numerical gold-standard checks against R (machine-epsilon Cox,
# gamma-frailty EM, recurrent events) run in the nightly slow tier; see
# .github/workflows/validation.yml and REPRODUCIBILITY.md.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install survivex + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run test suite (R-backed tests auto-skip without R)
        run: |
          pytest tests/ -v -p no:cacheprovider
