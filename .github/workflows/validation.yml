name: Validation (R gold standard)

# Slow tier: nightly numerical validation against R reference implementations.
# Installs R + the CRAN packages that survivex is validated against, then runs
# the gold-standard scripts (which exit non-zero on disagreement) plus the full
# pytest suite including the R-backed tests that the fast tier skips.
#
# Guarded to the canonical repository so forks don't burn minutes on it.
# Trigger manually from the Actions tab via workflow_dispatch, or nightly.

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC nightly
  workflow_dispatch:

jobs:
  validate:
    name: R gold-standard validation
    runs-on: ubuntu-latest
    if: github.repository == 'plasserre/Survivex'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rlibs-${{ hashFiles('.github/workflows/validation.yml') }}

      - name: Install R gold-standard packages
        run: |
          Rscript -e 'install.packages(c("survival","penalized","frailtyEM","coxme","cmprsk"), repos="https://cloud.r-project.org")'

      - name: Install survivex + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Cox PH vs R survival + penalized (machine epsilon)
        run: python tests/validate_coxph_vs_R.py

      - name: Gamma frailty vs frailtyEM (EM)
        run: python tests/validate_frailty_vs_R.py

      - name: Recurrent events vs R survival (self-contained references)
        run: python tests/test_recurrent.py

      - name: Full pytest suite (includes R-backed tests)
        run: pytest tests/ -v -p no:cacheprovider
